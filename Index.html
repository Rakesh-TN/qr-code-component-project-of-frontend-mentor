<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | QR code component</title>
    <link rel="stylesheet" href="./CSS/style.css">
    <link rel="shortcut icon" href="./assets/favicon-32x32.png" type="image/x-icon">
</head>
<body>
    <main class="card">
        <section class="bg-color">
            <div class="card-top">
                <img src="./assets/image-qr-code.png" alt="No Image" class="image-size" />
            </div>
            <div class="card-base">
                <p class="text-header">Improve your front-end skills by building projects</p>
                <p class="text-para">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
            </div>
        </section>
    </main>
</body>
</html>
